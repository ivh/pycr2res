[project]
name = "pycr2res"
version = "0.1.0"
description = "Python recipes for the cr2res pipeline"
readme = "README.md"
requires-python = ">=3.11,<3.14"
dependencies = [
    "adari-core>=4.1.0",
    "astropy>=7.1.1",
    "edps>=1.6.0",
    "matplotlib>=3.10.7",
    "numpy>=2.3.4",
    "pycpl>=1.0.3",
    "pyesorex>=1.0.3",
    "scipy>=1.16.3",
]

[dependency-groups]
dev = [
    "pytest>=9.0.1",
    "ruff>=0.14.6",
    "pre-commit>=4.0.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["pycr2res"]

[tool.uv.sources]
pycpl = { index = "pycpl" }

[[tool.uv.index]]
name = "pycpl"
url = "https://ivh.github.io/pycpl/simple/"

[[tool.uv.index]]
name = "eso"
url = "https://ftp.eso.org/pub/dfs/pipelines/libraries/"

